# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Документация (TypeDoc + VitePress → GitHub Pages): деплой на пуш в master
# и по ручному запуску.
# Дока развязана с релизом пакета — отражает текущий master, включая правки
# статей и Readme между релизами. Релиз всё равно предваряется мерджем в master.

name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Active LTS: с 28.10.2025, EOL 28.04.2028
  NODE_VERSION: '24.x'
  # Каталог сборки VitePress; путь задан его конфигом по умолчанию.
  SITE_DIR: 'docs/.vitepress/dist'

# Разрешаем один активный деплой Pages за раз; новые пуши в master не отменяют текущий.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
