# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Публикация пакета в GitHub Packages. Каноничный путь — создание GitHub
# Release (событие release: published), тег создаётся вместе с релизом.
# Голый git push тега НЕ публикует: релиз — преднамеренный акт с release
# notes. Ручной перезапуск по существующему тегу — через workflow_dispatch
# (запасной и восстановительный путь). Два входа — одна job.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например, v1.2.3)'
        required: true
        type: string
      npm_tag:
        description: 'npm dist-tag (по умолчанию: replay)'
        required: false
        default: replay
        type: string

env:
  # Active LTS: с 28.10.2025, EOL 28.04.2028
  NODE_VERSION: '24'
  REGISTRY_URL: 'https://npm.pkg.github.com'
  NPM_SCOPE: '@andrey-aka-skif'

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      npm_tag: ${{ steps.resolve.outputs.npm_tag }}

    steps:
      - name: 🛒 Checkout (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Resolve and validate tag
        id: resolve
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          NPM_TAG="${{ inputs.npm_tag || 'latest' }}"

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Неверный формат тега: $TAG"
            echo "Ожидается: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          if ! git show-ref --tags --quiet "refs/tags/$TAG"; then
            echo "❌ Тег не существует: $TAG"
            exit 1
          fi

          echo "ref=refs/tags/$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT

          echo "📌 Тег: $TAG"
          echo "📦 Версия: ${TAG#v}"
          echo "🏷️ dist-tag: $NPM_TAG"
        shell: bash

  ci:
    needs: validate
    uses: './.github/workflows/ci.yml'
    with:
      ref: ${{ needs.validate.outputs.ref }}

  publish:
    needs: [validate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🛒 Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.ref }}

      - name: 📝 Update version in package.json
        run: |
          npm version ${{ needs.validate.outputs.version }} --no-git-tag-version --allow-same-version
          echo "✅ Версия в package.json обновлена до ${{ needs.validate.outputs.version }}"

      - name: 📥 Restore build from cache
        id: restore-cache
        uses: actions/cache/restore@v6
        with:
          path: dist/
          key: build-${{ github.sha }}-${{ hashFiles('src/**', 'package.json') }}
          restore-keys: |
            build-

      - name: ✅ Verify build exists
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist/)" ]; then
            echo "❌ Каталог сборки пуст или отсутствует"
            exit 1
          fi
          echo "✅ Сборка найдена в dist/"

      - name: ✨ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}
          scope: ${{ env.NPM_SCOPE }}

      - name: 🚀 Publish package to Github Registry
        run: npm publish --tag "${{ needs.validate.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
