# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Публикация пакета в GitHub Packages. Версия берётся из git-тега vX.Y.Z
# (в манифесте всегда 0.0.0).
# Единственный триггер — publish GitHub Release: релиз это преднамеренный акт с
# release notes, голый push тега НЕ публикует. Повторный прогон делается кнопкой
# Re-run, добор невыпущенного тега — созданием релиза; переиздать уже выпущенную
# версию нельзя, реестр не даёт перезаписать name@version.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  # Active LTS: с 28.10.2025, EOL 28.04.2028
  NODE_VERSION: '24.x'
  REGISTRY_URL: 'https://npm.pkg.github.com'
  NPM_SCOPE: '@andrey-aka-skif'
  TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  # Грубый префильтр для git tag --list, точный отбор делает TAG_PATTERN.
  TAG_GLOB: 'v*'
  # Префикс dist-тега линии сопровождения: LTS_PREFIX + v3 = lts-v3, штатный
  # dist-тег этой ветки. latest достаётся только старшему тегу репозитория,
  # то есть актуальной линии.
  # Префикс, а не суффикс, ради единого имени с зеркалом: Gitea отвергает
  # v3-lts, читая его как версию (issue #127).
  LTS_PREFIX: 'lts-'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 — нужен полный список тегов: dist-tag latest достаётся
      # только старшему из них (см. шаг «Версия и dist-tag из тега»).
      - name: Checkout по тегу релиза
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # registry-url + scope → setup-node пишет scoped-строку @andrey-aka-skif:registry=…
      # (не дефолтный реестр) и auth через NODE_AUTH_TOKEN. Committed .npmrc не нужен.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: ${{ env.REGISTRY_URL }}
          scope: ${{ env.NPM_SCOPE }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Версия и dist-tag из тега (манифест остаётся 0.0.0 в git)
        id: release
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAG="$GITHUB_REF_NAME"

          if ! printf '%s' "$TAG" | grep -Eq "$TAG_PATTERN"; then
            echo "Тег '$TAG' не соответствует формату vX.Y.Z" >&2
            exit 1
          fi

          npm version --no-git-tag-version --allow-same-version "${TAG#v}"

          # latest достаётся только старшей версии. Патч линии сопровождения,
          # выпущенный после новой мажорной, иначе увёл бы latest назад.
          if [ "$PRERELEASE" = 'true' ]; then
            NPM_TAG='next'
          else
            HIGHEST=$(git tag --list "$TAG_GLOB" --sort=v:refname \
              | grep -E "$TAG_PATTERN" | tail -n 1)
            if [ "$TAG" = "$HIGHEST" ]; then
              NPM_TAG='latest'
            else
              NPM_TAG="${LTS_PREFIX}${TAG%%.*}"
              echo "$TAG не старший тег (старший — $HIGHEST)"
            fi
          fi

          # Имя, читаемое как версия, отвергает зеркало в Gitea (issue #127).
          # Проверка стоит и здесь, чтобы имена дист-тегов не разъезжались
          # между зеркалами.
          if printf '%s' "$NPM_TAG" | grep -Eq '^v?[0-9]'; then
            echo "dist-tag '$NPM_TAG' начинается как версия — реестр отвергнет его" >&2
            exit 1
          fi

          echo "npm-tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Тег: $TAG, версия: ${TAG#v}, dist-tag: $NPM_TAG"

      - name: Сборка и проверка точек входа
        run: npm run test:dist

      # Встроенный токен вместо PAT: он не истекает, не требует ручного
      # обновления и ограничен этим репозиторием. Права даёт блок permissions.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --tag "${{ steps.release.outputs.npm-tag }}"
