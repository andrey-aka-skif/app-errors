# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2
updates:
  # Без этого экшены снова тихо отстанут на несколько мажоров
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    ignore:
      # typescript стоит ради typedoc, своего кода на нём нет. Мажор выходит за
      # peer-диапазон typedoc и роняет npm ci всей группе. Снять, когда typedoc
      # пустит дальше 6.0.x.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: 'development'
        patterns: ['*']
