# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: ['**']

jobs:
  build:
    # Метку node-24 раннер отображает на образ node:24-bookworm.
    # Active LTS: с 28.10.2025, EOL 28.04.2028.
    runs-on: node-24

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # test:dist собирает пакет через pretest:dist и сразу проверяет точки
      # входа: publint такие дефекты не ловит, а юнит-тесты гоняют src.
      - name: Сборка и проверка точек входа
        run: npm run test:dist
