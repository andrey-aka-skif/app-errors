# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: ['**']

env:
  # Active LTS: с 28.10.2025, EOL 28.04.2028
  NODE_VERSION: '24.x'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Мажор дублирует NODE_VERSION и правится вместе с ним.
      image: node:24-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # test:dist собирает пакет через pretest:dist и сразу проверяет точки
      # входа: publint такие дефекты не ловит, а юнит-тесты гоняют src.
      - name: Сборка и проверка точек входа
        run: npm run test:dist
