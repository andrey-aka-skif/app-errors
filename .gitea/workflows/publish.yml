# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Публикация пакета в реестр Gitea. Версия берётся из git-тега vX.Y.Z
# (в манифесте всегда 0.0.0).
# Триггеры:
#   - publish Release — каноничный путь. Голый push тега НЕ публикует:
#     релиз это преднамеренный акт с release notes;
#   - ручной запуск с тегом — пересборка/переиздание уже выпущенной версии.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для сборки и публикации (формат vX.Y.Z)'
        required: true
      npm-tag:
        description: >
          dist-tag для ручной публикации. По умолчанию replay — паркинг-тег,
          который НЕ сдвигает latest (нужно при пересборке/бэкфилле старой версии).
        required: false
        default: replay

permissions:
  contents: read
  packages: write

env:
  # Active LTS: с 28.10.2025, EOL 28.04.2028
  NODE_VERSION: '24.x'
  REGISTRY_URL: 'https://192.168.100.252:3000/api/packages/usov-andrey/npm/'
  NPM_SCOPE: '@andrey-aka-skif'
  TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+$'

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm

    steps:
      # fetch-depth: 0 — нужен полный список тегов: dist-tag latest достаётся
      # только старшему из них (см. шаг «Версия и dist-tag из тега»).
      - name: Checkout (по тегу события или указанному вручную)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # registry-url + scope → setup-node пишет scoped-строку @andrey-aka-skif:registry=…
      # (не дефолтный реестр) и auth через NODE_AUTH_TOKEN. Committed .npmrc не нужен.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: ${{ env.REGISTRY_URL }}
          scope: ${{ env.NPM_SCOPE }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Версия и dist-tag из тега (манифест остаётся 0.0.0 в git)
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_NPM_TAG: ${{ github.event.inputs.npm-tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"

          if ! printf '%s' "$TAG" | grep -Eq "$TAG_PATTERN"; then
            echo "Тег '$TAG' не соответствует формату vX.Y.Z" >&2
            exit 1
          fi

          npm version --no-git-tag-version --allow-same-version "${TAG#v}"

          # latest достаётся только старшей версии. Патч линии сопровождения,
          # выпущенный после новой мажорной, иначе увёл бы latest назад.
          if [ -n "$INPUT_NPM_TAG" ]; then
            NPM_TAG="$INPUT_NPM_TAG"
          elif [ "$PRERELEASE" = 'true' ]; then
            NPM_TAG='next'
          else
            HIGHEST=$(git tag --list 'v*' --sort=v:refname \
              | grep -E "$TAG_PATTERN" | tail -n 1)
            if [ "$TAG" = "$HIGHEST" ]; then
              NPM_TAG='latest'
            else
              NPM_TAG="${TAG%%.*}-lts"
              echo "$TAG не старший тег (старший — $HIGHEST)"
            fi
          fi

          echo "npm-tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Тег: $TAG, версия: ${TAG#v}, dist-tag: $NPM_TAG"

      - name: Build
        run: npm run build

      # Здесь остаётся PAT, в отличие от GitHub. Автоматический GITEA_TOKEN
      # не имеет авторизации на запись в реестр пакетов — документация Gitea
      # прямо предписывает обходиться персональным токеном.
      - name: Publish to Gitea Registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm publish --tag "${{ steps.release.outputs.npm-tag }}"
